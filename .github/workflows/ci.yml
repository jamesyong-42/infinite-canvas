name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check (library)
        run: pnpm exec tsc --noEmit -p packages/infinite-canvas/tsconfig.json

      # RFC-010 Phase 5 regression: the markDirty→invalidatePresent rename
      # broke 13 call sites in apps/playground, but CI only typechecked the
      # library so it passed. Gate the playground too — it consumes the
      # public API and is the canonical example consumer.
      - name: Type check (playground)
        run: pnpm exec tsc --noEmit -p apps/playground/tsconfig.json

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test
